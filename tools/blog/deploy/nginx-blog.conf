# Public HTTPS listener for the personal blog. The app itself stays on localhost.
server {
    listen 5012 ssl;
    server_name 47.103.222.155;
    ssl_certificate /etc/nginx/ssl/ip.crt;
    ssl_certificate_key /etc/nginx/ssl/ip.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # 博客要传照片，上限放宽到 12m（后端限制 10MB，留点余量）
    client_max_body_size 12m;
    location / {
        proxy_pass http://127.0.0.1:8012;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
